# AWS Amplify Hosting. No build step: the repo is the site.
# The build phase only removes files that belong in the repo but not on the web.
version: 1
frontend:
  phases:
    build:
      commands:
        - rm -rf preview partials logo-src HANDOFF.md home.src.html pipeline.src.html deal.src.html tools.src.html .gitignore make-card.py make-social.py extract-copy.py social make-tools.py make-ask.py lambda tests amplify.yml
  artifacts:
    baseDirectory: /
    files:
      - '**/*'
  cache:
    paths: []
